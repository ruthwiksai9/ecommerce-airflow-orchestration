name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  dag-integrity:
    name: DAG Integrity Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Initialize Airflow DB
        env:
          AIRFLOW__CORE__EXECUTOR: SequentialExecutor
          AIRFLOW__CORE__SQL_ALCHEMY_CONN: sqlite:////tmp/airflow_test.db
          AIRFLOW__CORE__LOAD_EXAMPLES: "false"
          AIRFLOW__CORE__DAGS_FOLDER: ${{ github.workspace }}/dags
        run: airflow db init

      - name: Run DAG integrity tests
        env:
          AIRFLOW__CORE__EXECUTOR: SequentialExecutor
          AIRFLOW__CORE__SQL_ALCHEMY_CONN: sqlite:////tmp/airflow_test.db
          AIRFLOW__CORE__LOAD_EXAMPLES: "false"
          AIRFLOW__CORE__DAGS_FOLDER: ${{ github.workspace }}/dags
        run: pytest tests/ -v

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install linters
        run: pip install ruff

      - name: Ruff lint
        run: ruff check dags/ plugins/ tests/ --output-format=github

      - name: Ruff format check
        run: ruff format dags/ plugins/ tests/ --check
